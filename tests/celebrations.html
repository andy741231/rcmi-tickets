<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebration Preview</title>
<!-- Dev fixture: previews the ticket celebration animations from
     app/src/composables/useConfetti.js (source, not the built bundle). -->
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; margin: 0; padding: 32px 16px; background: #fff; color: #1f2937; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #54585A; }
    h1 { font-family: 'League Gothic', 'Arial Narrow', sans-serif; font-weight: 400; font-size: 44px; letter-spacing: .02em; text-transform: uppercase; margin: 2px 0 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    button { font: 600 15px 'Source Sans 3', sans-serif; padding: 10px 16px; border-radius: 8px; border: 1px solid #C8102E; background: #C8102E; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #C8102E; }
    button small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
    label { display: inline-flex; gap: 8px; align-items: center; margin-top: 16px; font-size: 14px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-top: 24px; }
    .card p { margin: 0 0 8px; color: #54585A; }
</style>
</head>
<body>
<div class="wrap">
    <p class="eyebrow">RCMI Tickets</p>
    <h1>Celebration preview</h1>
    <div class="row">
        <button data-run="submitted">Ticket submitted<small>cannons + balloons</small></button>
        <button data-run="burst">Ticket approved<small>final approval step</small></button>
        <button data-run="fireworks">Ticket completed<small>fireworks</small></button>
    </div>
    <label><input type="checkbox" id="rm"> Simulate “reduce motion” (badge only)</label>
    <div class="card">
        <p><strong>Ticket #123 · Sample request</strong></p>
        <p>Placeholder content so you can see how the animations layer over a ticket page.</p>
        <p>Tip: resize the window to phone width to check the mobile layout.</p>
    </div>
</div>
<script type="module">
    const { useConfetti } = await import('../app/src/composables/useConfetti.js?v=' + Date.now());
    const c = useConfetti();
    const subtext = { submitted: 'Ticket #123', burst: 'Ticket #123 approved', fireworks: 'Ticket #123' };
    const realMatch = window.matchMedia.bind(window);
    document.querySelectorAll('[data-run]').forEach((btn) => btn.addEventListener('click', () => {
        const reduce = document.getElementById('rm').checked;
        window.matchMedia = (q) => (reduce && q.includes('reduced-motion')) ? { matches: true } : realMatch(q);
        c[btn.dataset.run]({ subtext: subtext[btn.dataset.run] });
    }));
    window.c = c;
</script>
</body>
</html>
